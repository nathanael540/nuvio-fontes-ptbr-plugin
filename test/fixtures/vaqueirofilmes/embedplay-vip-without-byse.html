<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>Django Livre - 2012</title>
</head>
<body>
  <!-- Excerto sanitizado da página de opções de áudio observada em 20/11/2026 para o filme 68718. -->
  <div class="players_select_container">
    <div class="select_languages">
      Selecione um Áudio
      <div class="languages_selector">
        <div class="select_language active" data-target="1">
          Dublado
        </div>
        <div class="select_language" data-target="2">
          Legendado
        </div>
      </div>
    </div>
    <div class="players_select">
      <div class="players_select_items visible" data-target="1">
        <div class="player_select_item" data-id="100001">
          <div class="player_select_icon"><i class="ri-play-circle-line"></i></div>
          <div class="player_select_name">Opção 1 (ABYS)</div>
        </div>
        <div class="player_select_item" data-id="100002">
          <div class="player_select_icon"><i class="ri-play-circle-line"></i></div>
          <div class="player_select_name">Opção 2 (UPNS)</div>
        </div>
      </div>
      <div class="players_select_items" data-target="2">
        <div class="player_select_item">
          <div class="player_select_icon"><i class="ri-play-circle-line"></i></div>
          <div class="player_select_name">Legendado (EUA)</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
